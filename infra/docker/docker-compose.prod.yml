# Self-host üretim yığını — MIMARI-PLAN §2 / §11.
#
# Tek compose: Postgres, Redis, MinIO, api, worker, app, web, Caddy.
# Vercel Cron yerine gerçek scheduler (worker), süre sınırı yok.
#
# Kullanım:
#   cp .env.example .env && $EDITOR .env
#   docker compose -f infra/docker/docker-compose.prod.yml up -d --build
name: yonetim

x-api-env: &api-env
  NODE_ENV: production
  # RLS'e tabi uygulama rolü — tenant verisi buradan okunur/yazılır.
  DATABASE_URL: postgres://${PG_APP_USER:-yonetim_app}:${PG_APP_PASSWORD:?zorunlu}@postgres:5432/${PG_DB:-yonetim}
  # BYPASSRLS yetkili platform rolü — oturum çözümleme, denetim, cron.
  DATABASE_ADMIN_URL: postgres://${PG_ADMIN_USER:-yonetim_admin}:${PG_ADMIN_PASSWORD:?zorunlu}@postgres:5432/${PG_DB:-yonetim}
  # Şema sahibi — yalnız migration.
  DATABASE_OWNER_URL: postgres://${PG_OWNER_USER:-yonetim}:${PG_OWNER_PASSWORD:?zorunlu}@postgres:5432/${PG_DB:-yonetim}
  REDIS_URL: redis://redis:6379
  AUTH_SECRET: ${AUTH_SECRET:?zorunlu}
  # ← YALNIZ api ve worker. app'te YOK (§8.3 değişmez 4).
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?zorunlu}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?zorunlu}
  SESSION_CACHE_TTL: "60"
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-yonetim}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-yonetim}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?zorunlu}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      APP_DOMAIN: ${APP_DOMAIN:-panel.localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app, web, api]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${PG_OWNER_USER:-yonetim}
      POSTGRES_PASSWORD: ${PG_OWNER_PASSWORD:?zorunlu}
      POSTGRES_DB: ${PG_DB:-yonetim}
      TZ: Europe/Istanbul
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-yonetim}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?zorunlu}
    volumes: [miniodata:/data]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *api-env
      PORT: "3000"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    # MIGRATION SAHİBİ: init aşamasında advisory lock'lu migrate (§11).
    # Replika sayısı artsa da yalnız biri koşar; worker hiç koşmaz.
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      <<: *api-env
      API_INTERNAL_URL: http://api:3000
    # Migration KOŞMAZ — şemayı hazır bulur; `api` sağlıklı olmadan başlamaz.
    depends_on:
      api: { condition: service_healthy }

  app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      # İç ağ, TLS yok, keep-alive var (§9.2b).
      API_INTERNAL_URL: http://api:3000
      NEXT_PUBLIC_BASE_URL: https://${SITE_DOMAIN:-localhost}
      NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN:-panel.localhost}
      # DATABASE_URL YOK — kasıtlı ve en güçlü kalite kapısı (§11).
      # FIELD_ENCRYPTION_KEY YOK — TCKN/IBAN çözme yalnız api'de (§8.3).
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_BASE_URL: https://${SITE_DOMAIN:-localhost}
      NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN:-panel.localhost}

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
