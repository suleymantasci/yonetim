# Yerel geliştirme altyapısı — MIMARI-PLAN §11.
#
# Bu dosya yalnız **bağımlılıkları** ayağa kaldırır (Postgres, Redis, MinIO);
# api/app/web geliştiricinin makinesinde `pnpm dev` ile koşar. Üretim yığını
# için `docker-compose.prod.yml`.
#
# Kullanım: docker compose -f infra/docker/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: yonetim-postgres
    environment:
      POSTGRES_USER: yonetim
      POSTGRES_PASSWORD: yonetim
      POSTGRES_DB: yonetim
      # Türkçe sıralama ve tarih biçimi için:
      LANG: tr_TR.utf8
      TZ: Europe/Istanbul
    ports:
      - "5433:5432"
    volumes:
      - yonetim_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yonetim -d yonetim"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: yonetim-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - yonetim_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 uyumlu depolama: belge, dekont, sertifika PDF'leri (§12.2).
  # Geliştirmede Cloudflare R2 yerine MinIO — aynı SDK, aynı presigned PUT akışı.
  minio:
    image: minio/minio
    container_name: yonetim-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: yonetim
      MINIO_ROOT_PASSWORD: yonetim123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - yonetim_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  yonetim_pgdata:
  yonetim_redisdata:
  yonetim_miniodata:
