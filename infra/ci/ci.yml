# GitHub Actions CI — SPEC Bölüm 20 (Faz 0: PR preview, lint, type-check, test).
#
# ⚠ BU DOSYA REFERANS KOPYADIR; çalışan sürüm `.github/workflows/ci.yml`.
# İkisinden birini değiştirdiğinizde diğerini de güncelleyin.
name: CI

# Yalnız doküman değişen push'lar CI dakikası harcamasın (her koşu ~24 dk).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

# PR'da yeni push eskisini iptal eder; main'de etmez — sık push'ta her çalışma
# iptal ediliyor ve hiçbiri deploy'a ulaşmıyordu. main koşuları sırayla biter
# (deploy job'unun kendi `deploy-vekil` grubu çakışmayı zaten engelliyor).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Tip kontrolü, test ve derleme
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # M-26: GITHUB_TOKEN izinlerini en az yetkiyle sınırla. Depo default
    # `read-all` ise bir PR'dan gelen kod başka PR'ları tetikleyebilir veya
    # metadata yazabilir; bizim için yalnız `contents: read` yeterli.
    permissions:
      contents: read
      # Son başarılı main koşusunu bulmak için (değişen imajlar adımı).
      actions: read

    outputs:
      services: ${{ steps.changes.outputs.services }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yonetim
          POSTGRES_PASSWORD: yonetim
          POSTGRES_DB: yonetim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yonetim -d yonetim"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql://yonetim_app:yonetim_app@localhost:5432/yonetim
      DATABASE_ADMIN_URL: postgresql://yonetim_admin:yonetim_admin@localhost:5432/yonetim
      DATABASE_OWNER_URL: postgresql://yonetim:yonetim@localhost:5432/yonetim
      # Yalnız CI'ye özel değerler — api açılışta uzunluk/entropi denetliyor
      # (`ci-secret` ve tekrar eden hex reddediliyordu, API hiç açılmıyordu).
      AUTH_SECRET: ci-only-auth-secret-not-for-production-0123456789
      FIELD_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4
        with:
          # Değişen imajları bulmak için son başarılı koşunun commit'i lazım.
          fetch-depth: 0

      # Sürüm package.json `packageManager` alanından; burada ikinci kez
      # verilirse action "Multiple versions of pnpm specified" ile duruyor.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Değişen imajlar
        # İmaj job'ları dakikanın büyük kısmını yiyordu (push başına ~16 dk):
        # landing (`web`) neredeyse hiç değişmediği halde her push'ta derleniyordu.
        # Taban, main'deki SON BAŞARILI koşu — yalnız bir önceki push değil:
        # kırmızı biten bir koşunun derleyemediği imaj bir sonrakinde atlanmasın.
        # Etkilenen uygulamaları turbo bağımlılık grafiğinden alıyoruz
        # (packages/i18n değişirse onu kullanan web de derlenir).
        # Taban bulunamazsa hepsi derlenir.
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          all='["api","worker","app","web"]'
          if [ -z "$BASE" ]; then
            BASE=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' || true)
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Taban commit yok — tüm imajlar derlenecek."
            echo "services=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Taban: $BASE"
          apps=$(pnpm exec turbo ls --filter="...[$BASE...HEAD]" --output=json \
            | jq -c '[.packages.items[] | select(.path | startswith("apps/")) | .path | ltrimstr("apps/")]')
          # Dockerfile değişikliği turbo grafiğinde görünmüyor.
          docker=$(git diff --name-only "$BASE" HEAD -- infra/docker \
            | sed -nE 's#^infra/docker/Dockerfile\.(api|worker|app|web)$#\1#p' | jq -R . | jq -sc .)
          services=$(jq -nc --argjson a "$apps" --argjson d "$docker" --argjson all "$all" \
            '$all | map(select(. as $s | ($a + $d) | index($s)))')
          echo "Derlenecek imajlar: $services"
          echo "services=$services" >> "$GITHUB_OUTPUT"

      - name: Tip kontrolü (paketler + testler)
        run: pnpm exec tsc --noEmit -p tsconfig.check.json

      - name: Tip kontrolü (uygulamalar)
        # `tsconfig.check.json` yalnız `packages/*` ve `tests/*` kapsıyor;
        # `apps/api`, `apps/app` ve `apps/worker` onun `include` listesinde
        # yok. Bu adım olmadan uygulama kodundaki tip hatası ancak `next build`
        # aşamasında, hem de yalnız Next uygulamaları için görülüyordu —
        # `apps/api` (Nest) hiç denetlenmiyordu.
        run: pnpm typecheck

      - name: Mimari değişmezler (§8.3 / §15)
        # ESLint doğrudan importu görür, dolaylı olanı görmez:
        # `apps/app → @yonetim/jobs → @yonetim/db` zinciri her adımı tek tek
        # bakınca kurallara uygundu, zincirin tamamı değildi.
        run: pnpm arch

      - name: Birim testleri
        run: pnpm test

      - name: Şema ve RLS uygula
        # `db:generate` burada koşmuyor: migration'lar repoda; generate yeni
        # migration üretmek için geliştirici komutu ve snapshot farkında
        # etkileşimli soru sorup CI'yi kilitliyordu.
        run: |
          pnpm db:migrate
          SEED_DEMO=false pnpm db:seed

      - name: API'yi başlat (entegrasyon testleri için)
        # Entegrasyon testlerinin bir kısmı (kimlik yolları, sakin portalı)
        # HTTP üzerinden çalışan bir API'ye ihtiyaç duyuyor. Bu adım olmadan
        # o testler API'ye ulaşamayıp **atlanıyordu** ve CI yine yeşil
        # görünüyordu — yani hiç koşmayan testler koşuyormuş gibi sayılıyordu.
        run: |
          pnpm --filter @yonetim/api build
          # `nohup` + log dosyası: adım bittiğinde kabuk kapanıyor, süreç
          # arkada kalmalı. Açılış hatası (eksik ortam değişkeni gibi) ancak
          # log'a bakılarak anlaşılır, o yüzden başarısızlıkta basılıyor.
          PORT=3100 nohup node apps/api/dist/apps/api/src/main.js > /tmp/api.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3100/health >/dev/null; then
              echo "API hazır"
              exit 0
            fi
            sleep 2
          done
          echo "API 60 saniyede ayağa kalkmadı:" >&2
          cat /tmp/api.log >&2
          exit 1

      - name: Entegrasyon testleri (RLS izolasyonu, borç motoru, sakin portalı)
        run: pnpm test:integration

      - name: Lint (jsx-a11y dahil)
        # `next build` yalnız kendi uygulamasını denetliyor; paketler ve
        # betikler bu adım olmadan hiç lint'lenmiyordu.
        run: pnpm lint

      # Next uygulamaları imaj job'unda bir kez daha derleniyor. app/web
      # etkilenmediyse (yalnız api/worker değişikliği) bu iki adım boşa
      # dakika harcıyordu; PR'da her zaman koşar.
      - name: Uygulamaları derle
        if: github.event_name == 'pull_request' || contains(steps.changes.outputs.services, '"app"') || contains(steps.changes.outputs.services, '"web"')
        run: pnpm build

      - name: Bundle bütçesi (§12.3 — 250 kB)
        # Derleme sonrası çalışır: manifest'e ihtiyaç duyuyor. Bu kapı olmadan
        # `packages/ui` barrel'ına eklenen tek bir `export *` satırı pazarlama
        # sitesinin ilk yükünü 137 kB'den 184 kB'ye çıkarmıştı — kimse görmedi.
        if: github.event_name == 'pull_request' || contains(steps.changes.outputs.services, '"app"') || contains(steps.changes.outputs.services, '"web"')
        run: node scripts/bundle-budget.mjs

  # Bağımlılık denetimi (pnpm audit) ayrı iş akışında: .github/workflows/audit.yml
  # (haftalık + lockfile değişince) — her push'ta ayrı job 1 dk yiyordu.

  # ---------------------------------------------------------------------------
  # Test ortamı: main'e her push'ta imajlar derlenip vekil.tasci.cloud'a çıkar.
  # Domain gerçek adrese taşındığında `env` altındaki iki URL değişir; imajlar
  # NEXT_PUBLIC_* değerlerini derleme anında gömüyor.
  # ---------------------------------------------------------------------------
  images:
    name: İmaj (${{ matrix.service }})
    needs: quality
    # Hiçbir imaj etkilenmediyse job da deploy da atlanır.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJSON(needs.quality.outputs.services) }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUBLIC_BASE_URL: https://vekil.tasci.cloud
      PUBLIC_APP_URL: https://panel.vekil.tasci.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.service }}
          push: true
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ env.PUBLIC_BASE_URL }}
            NEXT_PUBLIC_APP_URL=${{ env.PUBLIC_APP_URL }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.service }}-latest
            ${{ env.IMAGE }}:${{ matrix.service }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy (vekil.tasci.cloud)
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: deploy-vekil
      cancel-in-progress: false
    env:
      HAS_DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY != '' }}
    steps:
      - name: Deploy anahtarı tanımlı mı
        if: env.HAS_DEPLOY_KEY != 'true'
        run: |
          echo "::warning::SERVER_SSH_KEY secret'ı yok — imajlar ghcr.io'ya gönderildi ama sunucuya deploy edilmedi (CALISTIRMA.md §C)."
      # Sunucudaki anahtar `command="/docker/yonetim/deploy.sh"` ile kısıtlı;
      # gönderilen komut yok sayılıp yalnız deploy betiği koşuyor
      # (infra/deploy/vekil/deploy.sh).
      - uses: appleboy/ssh-action@v1.0.3
        if: env.HAS_DEPLOY_KEY == 'true'
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: deploy
